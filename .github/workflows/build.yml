name: Build

on:
  push:
    # Reine Doku-Änderungen erzeugen keine neue App-Version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      # Eigenes Signatur-Zertifikat (GitHub-Secret SIGNING_CERT_P12, base64-codierte .p12-Datei).
      # Fehlt es, wird wie bisher ad-hoc signiert.
      - name: Signatur-Zertifikat laden
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "Kein Zertifikat hinterlegt – ad-hoc-Signatur"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/sidebar-signing.keychain-db"
          KPASS="$(uuidgen)"
          # Leerzeichen/Zeilenumbrüche aus dem Einfügen entfernen
          CLEAN="$(printf '%s' "$SIGNING_CERT_P12" | tr -d ' \r\n\t')"
          echo "Länge des hinterlegten Werts: ${#CLEAN} Zeichen"
          if ! printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/sidebar.p12" 2>/dev/null; then
            echo "::warning::Hinterlegter Wert ist kein gültiges base64 – ad-hoc-Signatur"
            exit 0
          fi
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/sidebar.p12" -k "$KEYCHAIN" -P sidebar -T /usr/bin/codesign; then
            echo "::warning::Zertifikat konnte nicht importiert werden – ad-hoc-Signatur"
            rm -f "$RUNNER_TEMP/sidebar.p12"
            exit 0
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sidebar.p12"
          security find-identity -p codesigning "$KEYCHAIN" || true
          echo "SIGN_IDENTITY=Sidebar Signing" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: App bauen
        run: ./build.sh

      - name: App zippen
        run: cd build && ditto -c -k --keepParent Sidebar.app Sidebar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sidebar-app
          path: build/Sidebar.zip

      # Nur auf dem Hauptzweig: neue Version veröffentlichen.
      # Die App findet sie über "Nach Updates suchen" und installiert sie per Klick.
      - name: Version veröffentlichen
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" build/Sidebar.zip \
            --title "Sidebar $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: App bauen
        run: ./build.sh

      - name: App zippen
        run: cd build && ditto -c -k --keepParent Sidebar.app Sidebar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sidebar-app
          path: build/Sidebar.zip

      # Nur auf dem Hauptzweig: neue Version veröffentlichen.
      # Die App findet sie über "Nach Updates suchen" und installiert sie per Klick.
      - name: Version veröffentlichen
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" build/Sidebar.zip \
            --title "Sidebar $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

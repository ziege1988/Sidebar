name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: App bauen
        run: ./build.sh

      - name: App zippen
        run: cd build && ditto -c -k --keepParent Sidebar.app Sidebar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sidebar-app
          path: build/Sidebar.zip

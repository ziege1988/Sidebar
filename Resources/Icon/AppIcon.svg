<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9D0B0"/>
      <stop offset="1" stop-color="#6F8F67"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E3A2C" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- macOS-Grundform (824 × 824 im 1024er-Raster) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Leiste -->
  <g filter="url(#soft)">
    <rect x="196" y="216" width="150" height="592" rx="44" fill="#2B2D31"/>
  </g>
  <rect x="246" y="240" width="50" height="10" rx="5" fill="#A2A89E" opacity=".6"/>
  <!-- Favoriten -->
  <rect x="234" y="276" width="74" height="74" rx="20" fill="#E8B4A0"/>
  <rect x="234" y="368" width="74" height="74" rx="20" fill="#B7C9E8"/>
  <rect x="234" y="460" width="74" height="74" rx="20" fill="#E9D59C"/>
  <rect x="241" y="556" width="60" height="5" rx="2.5" fill="#FFFFFF" opacity=".14"/>
  <!-- Ordner -->
  <rect x="234" y="584" width="74" height="74" rx="20" fill="#B3CBAD"/>
  <rect x="234" y="676" width="74" height="74" rx="20" fill="#B3CBAD" opacity=".28"/>
  <path d="M252 610 h14 l7 7 h17 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 v-27 a4 4 0 0 1 4 -4z" fill="#2B2D31"/>

  <!-- Ordner-Fenster -->
  <g filter="url(#soft)">
    <rect x="374" y="470" width="452" height="306" rx="44" fill="#F4F7F2"/>
  </g>
  <rect x="404" y="502" width="40" height="40" rx="12" fill="#6F8F67"/>
  <rect x="460" y="512" width="170" height="20" rx="10" fill="#2E3A2C" opacity=".8"/>
  <rect x="398" y="560" width="404" height="2" fill="#2E3A2C" opacity=".1"/>
  <rect x="404" y="584" width="40" height="40" rx="11" fill="#E8B4A0"/>
  <rect x="460" y="596" width="220" height="16" rx="8" fill="#2E3A2C" opacity=".35"/>
  <rect x="396" y="638" width="410" height="56" rx="16" fill="#6F8F67" opacity=".16"/>
  <rect x="404" y="646" width="40" height="40" rx="11" fill="#B7C9E8"/>
  <rect x="460" y="658" width="180" height="16" rx="8" fill="#2E3A2C" opacity=".35"/>
  <rect x="404" y="708" width="40" height="40" rx="11" fill="#E9D59C"/>
  <rect x="460" y="720" width="250" height="16" rx="8" fill="#2E3A2C" opacity=".35"/>
</svg>
